# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.label && format(', {0}', matrix.config.label) || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # CRAN checks one flavour with only Depends/Imports/LinkingTo installed.
          # dunnett_test(), emmeans_test() and wilcox_effsize() stop() without their
          # Suggests package, so an unguarded example or test errors there and
          # nowhere else. Without this entry that failure is invisible to us.
          # Skip the vignette here, at build time (--no-build-vignettes) AND at
          # check time (--ignore-vignettes): the vignette engine (knitr/rmarkdown)
          # is a Suggests package, so with only hard dependencies installed
          # R CMD build cannot even load the VignetteBuilder. (pak used to
          # install the builder despite deps: hard, which made --ignore-vignettes
          # alone sufficient; its resolver stopped doing so in July 2026 and the
          # build step started failing with "vignette builder 'knitr' not
          # found".) CRAN's own depends-only flavour checks the already-built
          # tarball, so it never hits this. This job's purpose -- catching
          # unguarded Suggests use in examples/tests -- is unaffected; those
          # still run.
          # extra-packages adds the test driver: tests/testthat.R needs
          # library(testthat) to run at all, and CRAN's depends-only flavour has
          # the driver available too -- only the package's own code is limited
          # to hard dependencies. (pak's resolver used to install it implicitly
          # under deps: hard, like the vignette engine above; it stopped in
          # July 2026 and the check step started dying at library(testthat).)
          - {os: ubuntu-latest,   r: 'release', label: 'noSuggests', deps: 'hard', depends-only: 'true', check-args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")', build-args: 'c("--no-manual", "--no-build-vignettes")', extra-packages: 'any::rcmdcheck, any::testthat'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.depends-only || 'false' }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ matrix.config.extra-packages || 'any::rcmdcheck' }}
          dependencies: ${{ matrix.config.deps && '"hard"' || '"all"' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.check-args || 'c("--no-manual", "--as-cran")' }}
          build_args: ${{ matrix.config.build-args || '"--no-manual"' }}
          upload-snapshots: true
